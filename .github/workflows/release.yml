name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # Required to create the GitHub Release.

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'ci skip')"
    env:
      # Only SIGN_KEY_STORE_BASE64 and SIGN_KEY_STORE_PASSWORD are required. The alias defaults to
      # "netmeter" and the key password to the store password (PKCS12 keystores use one password).
      SIGN_ALIAS: ${{ secrets.SIGN_KEY_ALIAS || 'netmeter' }}
      SIGN_KEY_PASS: ${{ secrets.SIGN_KEY_PASSWORD || secrets.SIGN_KEY_STORE_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # The full commit history is required to generate versionCode correctly.

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check signing secrets
        env:
          SIGN_KEY_STORE_BASE64: ${{ secrets.SIGN_KEY_STORE_BASE64 }}
          SIGN_KEY_STORE_PASSWORD: ${{ secrets.SIGN_KEY_STORE_PASSWORD }}
        run: |
          missing=0
          for name in SIGN_KEY_STORE_BASE64 SIGN_KEY_STORE_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set."
              missing=1
            fi
          done
          exit $missing

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
      - name: Decode Keystore
        run: |
          echo "${{ secrets.SIGN_KEY_STORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build Release Bundle
        env:
          SIGN_KEY_STORE_FILE: ${{ runner.temp }}/release.jks
          SIGN_KEY_STORE_PASSWORD: ${{ secrets.SIGN_KEY_STORE_PASSWORD }}
          SIGN_KEY_ALIAS: ${{ env.SIGN_ALIAS }}
          SIGN_KEY_PASSWORD: ${{ env.SIGN_KEY_PASS }}
        run: chmod a+x ./gradlew && ./gradlew bundleRelease

      - name: Download bundletool
        run: |
          BUNDLETOOL_VERSION=1.17.2
          curl -fsSL \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar" \
            -o bundletool.jar

      - name: Extract Universal APK from AAB
        env:
          SIGN_STORE_PASS: ${{ secrets.SIGN_KEY_STORE_PASSWORD }}
        run: |
          mkdir -p apk-output
          java -jar bundletool.jar build-apks \
            --bundle=app/build/outputs/bundle/release/app-release.aab \
            --output=apk-output/app.apks \
            --mode=universal \
            --ks="$RUNNER_TEMP/release.jks" \
            --ks-pass="pass:$SIGN_STORE_PASS" \
            --ks-key-alias="$SIGN_ALIAS" \
            --key-pass="pass:$SIGN_KEY_PASS"
          unzip apk-output/app.apks universal.apk -d apk-output/
          mv apk-output/universal.apk "apk-output/NetMeterTW-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/bundle/release/app-release.aab \
             "apk-output/NetMeterTW-${GITHUB_REF_NAME}.aab"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: NetMeter TW ${{ github.ref_name }}
          # Fork release notes; CHANGELOG.md stays as upstream's history for easier merges.
          body_path: RELEASE_NOTES.md
          files: |
            apk-output/NetMeterTW-${{ github.ref_name }}.apk
            apk-output/NetMeterTW-${{ github.ref_name }}.aab

      - name: Cleanup Keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
